name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch name is category/module-slug
        run: |
          if ! echo "$HEAD_REF" | grep -qE '^(feat|fix|perf|refactor|schema|test|docs|ci|sec|chore)/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "branch '$HEAD_REF' violates <category>/<module>-<slug> (README: Development workflow)"
            exit 1
          fi
      - name: "PR title is 'module: Summary.'"
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^[a-z][a-z0-9]*: [A-Z].+\.$'; then
            echo "PR title '$PR_TITLE' must be 'module: Summary.' (capitalized, trailing period)"
            exit 1
          fi
      - name: Code changes update the reality ledger
        run: |
          files=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          if echo "$files" | grep -qE '^internal/' && ! echo "$files" | grep -q '^docs/REALITY.md$'; then
            echo "internal/ changed without docs/REALITY.md — update the subsystem's row in the same PR (rating may stay, evidence/gaps must be current)"
            exit 1
          fi

  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # staticcheck: the analyzer layer beyond go vet. govulncheck: called-
      # symbol scanning against the Go vulnerability database — it gates on
      # vulnerabilities our code REACHES, not mere presence in go.sum.
      # (CodeQL + Codecov are the go-public upgrades: both are paid/limited
      # for private repos; revisit at the licensing decision.)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:55432/postgres
        # -p 1: test packages share one database and each resets the schema —
        # parallel packages would clobber each other.
        # Coverage is measured ACROSS packages (-coverpkg): the domain
        # modules are exercised by the rest-layer integration tests. The
        # floor ratchets up, never down (72% when introduced at 75.0%).
        run: |
          go test -p 1 -coverpkg=./internal/... ./... -count=1 -coverprofile=cover.out
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "### internal/ statement coverage: ${total}% (floor 72%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t+0 < 72.0) { print "coverage " t "% fell below the 72% floor"; exit 1 } print "coverage " t "% clears the 72% floor" }'
      - name: Brand-token rule (docs/BRANDING.md)
        # No \b in patterns: git grep's word-boundary escape is not portable
        # across platforms (silently matches nothing on macOS libc).
        run: |
          set -e
          # Go: UI strings must come from internal/brand — no inline brand
          # literals. Module-path imports are the documented exception and
          # never match these patterns.
          if git grep -nE '"[^"]*Weft[^"]*"|"weft"' -- '*.go' ':(exclude)internal/brand'; then
            echo 'brand literal in Go outside internal/brand'; exit 1
          fi
          # Non-Go MACHINE surfaces (config, migrations, manifests) must not
          # name the brand. Prose (docs/, README) and package metadata may —
          # the rule protects rebrandability of code/config, not documentation.
          if git grep -liw weft -- ':(exclude)*.go' ':(exclude)docs/' \
              ':(exclude)README.md' ':(exclude)go.mod' ':(exclude)go.sum' \
              ':(exclude).github'; then
            echo 'brand literal in a non-Go machine surface (config/migration/manifest)'; exit 1
          fi
