name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:55432/postgres
        run: go test ./... -count=1
      - name: Brand-token rule (docs/BRANDING.md)
        # No \b in patterns: git grep's word-boundary escape is not portable
        # across platforms (silently matches nothing on macOS libc).
        run: |
          set -e
          # Go: UI strings must come from internal/brand — no inline brand
          # literals. Module-path imports are the documented exception and
          # never match these patterns.
          if git grep -nE '"[^"]*Weft[^"]*"|"weft"' -- '*.go' ':(exclude)internal/brand'; then
            echo 'brand literal in Go outside internal/brand'; exit 1
          fi
          # Non-Go surfaces: only the documented locations may name the brand.
          if git grep -liw weft -- ':(exclude)*.go' ':(exclude)docs/BRANDING.md' \
              ':(exclude)README.md' ':(exclude)go.mod' ':(exclude)go.sum' \
              ':(exclude).github'; then
            echo 'brand literal outside allowed non-Go locations'; exit 1
          fi
