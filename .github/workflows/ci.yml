name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:55432/postgres
        run: go test ./... -count=1
      - name: Brand-token rule (docs/BRANDING.md)
        run: |
          ! git grep -ilE '\bweft\b' -- \
            ':!internal/brand' ':!docs/BRANDING.md' ':!README.md' \
            ':!go.mod' ':!go.sum' ':!cmd/weftd' ':!.github' \
            || (echo 'brand literal outside allowed locations' && exit 1)
