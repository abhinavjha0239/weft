<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Brand}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6cff'/%3E%3Cg stroke='white' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 9v14M16 9v14M24 9v14'/%3E%3Cpath d='M6 13h20M6 19h20' stroke-opacity='.85'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6cff'/%3E%3Cg stroke='white' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 9v14M16 9v14M24 9v14'/%3E%3Cpath d='M6 13h20M6 19h20' stroke-opacity='.85'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e1016; --panel:#151823; --panel2:#1b1f2e; --line:#262b3d;
    --text:#e7eaf3; --dim:#8b91a7; --accent:#7c6cff; --accent2:#4f8cff;
    --ok:#3ecf8e; --danger:#ff6b6b; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;height:100vh;overflow:hidden}
  button{font:inherit;border:0;cursor:pointer;border-radius:8px}
  input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  ::placeholder{color:var(--dim)}

  /* auth */
  #auth{display:flex;align-items:center;justify-content:center;height:100vh}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:360px}
  .card h1{font-size:22px;letter-spacing:.3px;margin-bottom:2px}
  .card .tag{color:var(--dim);font-size:12.5px;margin-bottom:22px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button{flex:1;padding:8px;background:var(--panel2);color:var(--dim)}
  .tabs button.on{background:var(--accent);color:#fff}
  .card form{display:flex;flex-direction:column;gap:10px}
  .primary{background:var(--accent);color:#fff;padding:10px;font-weight:600}
  .primary:hover{filter:brightness(1.1)}
  .err{color:var(--danger);font-size:12.5px;min-height:16px}

  /* app shell */
  #app{display:none;height:100vh;grid-template-columns:250px 1fr;grid-template-rows:100vh}
  #app.on{display:grid}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .org{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .org b{font-size:15px}
  .org .me{color:var(--dim);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .org button{background:none;color:var(--dim);font-size:12px}
  .org button:hover{color:var(--danger)}
  .chhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .chhead button{background:var(--panel2);color:var(--accent);width:22px;height:22px;font-size:15px;line-height:1}
  #chlist{overflow-y:auto;flex:0 1 auto;min-height:38px;padding:4px 8px}
  .ch{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--dim);cursor:pointer;gap:8px}
  .ch:hover{background:var(--panel2)}
  .ch.on{background:var(--panel2);color:var(--text)}
  .ch .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .nm::before{content:"#";opacity:.55;margin-right:5px}
  .ch.priv .nm::before{content:"🔒";font-size:11px}
  .badge{background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
  .join{font-size:11px;color:var(--accent2);background:none}
  #splist{overflow-y:auto;flex:0 1 auto;padding:4px 8px}
  .sp .nm::before{content:"▦";font-size:11px;margin-right:6px;opacity:.6}
  .sp .key{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.5px}
  #dmlist{overflow-y:auto;flex:0 1 auto;padding:4px 8px}
  .dmrow .nm{display:flex;align-items:center;gap:7px}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
  .pdot.on{background:var(--ok)}
  .picker{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .picker label{display:flex;gap:9px;align-items:center;color:var(--text);font-size:13.5px;padding:6px 8px;border-radius:8px;cursor:pointer}
  .picker label:hover{background:var(--panel2)}
  .picker input[type=checkbox]{width:auto}

  main{display:flex;flex-direction:column;min-width:0}
  header{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header .title{font-weight:700;font-size:15px}
  header .desc{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .spacer{flex:1}
  header button{background:var(--panel2);color:var(--text);padding:7px 12px;font-size:12.5px}
  header button:hover{background:var(--line)}
  #crumb{color:var(--accent2);background:none;padding-left:0}

  #threads{display:none;border-bottom:1px solid var(--line);max-height:220px;overflow-y:auto;background:var(--panel)}
  #threads.on{display:block}
  #results{display:none;border-bottom:1px solid var(--line);max-height:300px;overflow-y:auto;background:var(--panel)}
  #results.on{display:block}
  .res{padding:9px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .res:hover{background:var(--panel2)}
  .res .rmeta{color:var(--dim);font-size:11.5px;margin-bottom:2px}
  .res .rsnip{font-size:13px}
  .res mark,.res .hl{background:rgba(124,108,255,.28);color:var(--text);border-radius:3px;padding:0 2px}
  .th{display:flex;gap:10px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .th:hover{background:var(--panel2)}
  .th .t{font-weight:600}
  .th .meta{color:var(--dim);font-size:12px}
  .th .res{color:var(--ok);font-size:12px}

  #msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
  .msg{display:flex;gap:12px;padding:6px 8px;border-radius:8px}
  .msg:hover{background:var(--panel)}
  .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .msg .who{font-weight:700;font-size:13.5px;margin-right:8px}
  .msg .when{color:var(--dim);font-size:11.5px}
  .msg .body{margin-top:1px;word-wrap:break-word}
  .body p{margin:2px 0}
  .body code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
  .body pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0}
  .body pre code{border:0;background:none;padding:0}
  .body blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--dim);margin:4px 0}
  .body a{color:var(--accent2)}
  .body .mention{background:rgba(124,108,255,.18);color:var(--accent);border-radius:5px;padding:0 4px;font-weight:600}
  .body table{border-collapse:collapse;margin:6px 0}
  .body td,.body th{border:1px solid var(--line);padding:4px 9px}
  .sys{color:var(--dim);font-size:12.5px;text-align:center;padding:6px}

  #typing{min-height:20px;color:var(--dim);font-size:12px;padding:0 22px}
  .composer{padding:0 20px 18px}
  .composer .box{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
  .composer textarea{background:none;border:0;resize:none;height:42px;padding:9px 0}
  .composer button{background:var(--accent);color:#fff;padding:0 18px;font-weight:700;border-radius:9px}

  /* board */
  #board{display:none;flex:1;overflow-x:auto;padding:16px 20px;gap:14px;align-items:flex-start}
  #board.on{display:flex}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:280px;min-width:240px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%}
  .col.over{border-color:var(--accent)}
  .colhead{padding:11px 14px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:7px}
  .colhead .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .col[data-cat="2"] .dot{background:var(--accent2)}
  .col[data-cat="3"] .dot{background:var(--ok)}
  .colhead .cnt{margin-left:auto;font-weight:700}
  .cards{padding:2px 10px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:44px}
  .itemcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:grab}
  .itemcard:hover{border-color:var(--accent)}
  .itemcard.drag{opacity:.4}
  .itemcard .ikey{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
  .itemcard .ikey .done{color:var(--ok);margin-left:auto}
  .itemcard .ititle{font-size:13px;margin-top:3px;word-wrap:break-word}
  .itype{font-size:10px;padding:0 6px;border-radius:6px;background:rgba(79,140,255,.15);color:var(--accent2)}
  .itype.bug{background:rgba(255,107,107,.15);color:var(--danger)}
  .itype.epic{background:rgba(124,108,255,.18);color:var(--accent)}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px;width:340px}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog h3{margin-bottom:14px}
  dialog form{display:flex;flex-direction:column;gap:10px}
  dialog label{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px}
  dialog label input[type=checkbox]{width:auto}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;display:none}
  #toast.ok{background:var(--ok);color:#06281a}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <h1>{{.Brand}}</h1>
    <div class="tag">{{.Tagline}}</div>
    <div class="tabs">
      <button id="tabIn" class="on">Sign in</button>
      <button id="tabUp">Create org</button>
    </div>
    <form id="authForm">
      <input id="fOrg" placeholder="org slug" autocomplete="username" required>
      <input id="fEmail" placeholder="email" type="email" required>
      <input id="fPass" placeholder="password" type="password" required>
      <input id="fName" placeholder="your full name" style="display:none">
      <button class="primary" id="authBtn">Sign in</button>
      <div class="err" id="authErr"></div>
    </form>
  </div>
</div>

<div id="app">
  <aside>
    <div class="org"><div><b id="orgName"></b><div class="me" id="meName"></div></div><button id="logout">sign out</button></div>
    <div class="chhead"><span>Channels</span><button id="newCh" title="New channel">+</button></div>
    <div id="chlist"></div>
    <div class="chhead"><span>Direct messages</span><button id="newDm" title="New conversation">+</button></div>
    <div id="dmlist"></div>
    <div class="chhead"><span>Spaces</span><button id="newSp" title="New space">+</button></div>
    <div id="splist"></div>
  </aside>
  <main>
    <header>
      <button id="crumb" style="display:none">← back</button>
      <span class="title" id="viewTitle"></span>
      <span class="desc" id="viewDesc"></span>
      <span class="spacer"></span>
      <input id="search" placeholder="Search… (from: in: has:link)" style="max-width:260px">
      <button id="thToggle">Threads</button>
      <button id="newTh">+ Thread</button>
      <button id="promote" style="display:none">→ Item</button>
      <button id="newIt" style="display:none">+ Item</button>
    </header>
    <div id="results"></div>
    <div id="threads"></div>
    <div id="board"></div>
    <div id="msgs"></div>
    <div id="typing"></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" placeholder="Message…  (**bold**, `code`, @**Full Name**, :rocket:)"></textarea>
        <button id="send">Send</button>
      </div>
    </div>
  </main>
</div>

<dialog id="chDialog">
  <h3>New channel</h3>
  <form method="dialog" id="chForm">
    <input id="chName" placeholder="name" required>
    <input id="chDesc" placeholder="description (optional)">
    <label><input type="checkbox" id="chPriv"> Private</label>
    <button class="primary">Create</button>
  </form>
</dialog>

<dialog id="thDialog">
  <h3>New thread</h3>
  <form method="dialog" id="thForm">
    <input id="thTitle" placeholder="title (optional)">
    <textarea id="thContent" placeholder="first message" required rows="3"></textarea>
    <button class="primary">Start thread</button>
  </form>
</dialog>

<dialog id="spDialog">
  <h3>New space</h3>
  <form method="dialog" id="spForm">
    <input id="spKey" placeholder="key (e.g. OPS)" maxlength="10" required>
    <input id="spName" placeholder="name" required>
    <button class="primary">Create space</button>
  </form>
</dialog>

<dialog id="itDialog">
  <h3>New item</h3>
  <form method="dialog" id="itForm">
    <input id="itTitle" placeholder="title" required>
    <textarea id="itDesc" placeholder="description — becomes the first message of the item's discussion" rows="3"></textarea>
    <select id="itType"><option>Task</option><option>Bug</option><option>Epic</option></select>
    <button class="primary">Create item</button>
  </form>
</dialog>

<dialog id="prDialog">
  <h3>Promote thread to item</h3>
  <form method="dialog" id="prForm">
    <select id="prSpace"></select>
    <button class="primary">Promote</button>
  </form>
</dialog>

<dialog id="dmDialog">
  <h3>New conversation</h3>
  <form method="dialog" id="dmForm">
    <div class="picker" id="dmPicker"></div>
    <button class="primary">Start conversation</button>
  </form>
</dialog>

<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const S = {
  token: localStorage.getItem("token") || "",
  org: localStorage.getItem("org") || "",
  channels: [], unreads: {}, users: {},
  ch: null, thread: 0, isRoot: true,
  spaces: [], space: null, items: [], statuses: [],
  dms: [], dm: null, dmUnreads: {}, online: new Set(),
  view: "chan", // "chan" (channel/thread chat) | "board" | "item" | "dm"
  lastSeq: -1, ws: null, wsTries: 0,
  typingUntil: 0, typers: new Map(),
};

function toast(msg, ok){ const t=$("#toast"); t.textContent=msg; t.style.display="block";
  t.classList.toggle("ok", !!ok);
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", 2600); }

async function api(path, opts={}) {
  opts.headers = Object.assign({"Content-Type":"application/json"},
    S.token ? {"Authorization":"Bearer "+S.token} : {}, opts.headers||{});
  const r = await fetch("/api/v1"+path, opts);
  if (!r.ok) {
    let m = "request failed ("+r.status+")";
    try { m = (await r.json()).error || m; } catch {}
    if (r.status === 401 && S.token) { signOut(); }
    throw new Error(m);
  }
  return r.json();
}
const post = (p,b) => api(p,{method:"POST",body:JSON.stringify(b||{})});

/* ---------- auth ---------- */
let signup = false;
function setMode(up){ signup = up;
  $("#tabIn").classList.toggle("on",!up); $("#tabUp").classList.toggle("on",up);
  $("#fName").style.display = up ? "" : "none";
  $("#authBtn").textContent = up ? "Create org" : "Sign in"; }
$("#tabIn").onclick = e=>{e.preventDefault(); setMode(false)};
$("#tabUp").onclick = e=>{e.preventDefault(); setMode(true)};
$("#authForm").onsubmit = async e => {
  e.preventDefault(); $("#authErr").textContent="";
  const org=$("#fOrg").value.trim(), email=$("#fEmail").value.trim(), pass=$("#fPass").value;
  try {
    let token;
    if (signup) {
      const r = await post("/orgs/bootstrap",
        {org_slug:org, email, password:pass, full_name:$("#fName").value.trim()});
      token = r.token;
    } else {
      token = (await post("/auth/login",{org_slug:org,email,password:pass})).token;
    }
    S.token = token; S.org = org;
    localStorage.setItem("token",token); localStorage.setItem("org",org);
    enter();
  } catch(err){ $("#authErr").textContent = err.message; }
};
function signOut(){ localStorage.clear(); location.reload(); }
$("#logout").onclick = signOut;

/* ---------- shell ---------- */
async function enter(){
  $("#auth").style.display="none"; $("#app").classList.add("on");
  $("#orgName").textContent = S.org;
  // Identity and presence FIRST: the list renderers below read S.me (DM
  // naming) and S.online (dots) — racing them caused a boot TypeError the
  // moment a conversation existed.
  const [me, pres] = await Promise.all([api("/me"), api("/presence")]);
  S.me = me;
  S.online = new Set(pres.online||[]);
  S.users[me.user_id] = {id: me.user_id, full_name: me.full_name};
  $("#meName").textContent = me.full_name;
  await Promise.all([refreshChannels(), refreshSpaces(), refreshDMs()]);
  const first = S.channels.find(c=>c.member);
  if (first) openChannel(first.id);
  connectWS();
}

/* ---------- profiles ---------- */
// Batch-resolve unknown user ids into S.users; renderers read from the
// cache synchronously afterwards. Unknown ids stay "user N" — never block.
async function resolveUsers(ids){
  const missing = [...new Set(ids)].filter(id=>id && !S.users[id]);
  if (!missing.length) return;
  try {
    const r = await api("/users?ids="+missing.join(","));
    for (const u of r.users||[]) S.users[u.id] = u;
  } catch {}
}
function userName(id){
  const u = S.users[id];
  return u ? u.full_name + (u.deactivated ? " (deactivated)" : "") : "user "+id;
}
function initials(id){
  const u = S.users[id];
  if (!u) return String(id).slice(-2);
  const parts = u.full_name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}

async function refreshChannels(){
  const [cl, un] = await Promise.all([api("/channels"), api("/unreads")]);
  S.channels = cl.channels;
  S.unreads = {}; (un.channels||[]).forEach(u=>S.unreads[u.channel_id]=u.unread_count);
  S.dmUnreads = {}; (un.dms||[]).forEach(u=>S.dmUnreads[u.dm_space_id]=u.unread_count);
  renderChannels(); renderDMs();
}

function renderChannels(){
  const el = $("#chlist"); el.innerHTML="";
  for (const c of S.channels){
    const d = document.createElement("div");
    d.className = "ch"+(c.private?" priv":"")+(S.ch && c.id===S.ch.id?" on":"");
    const n = S.unreads[c.id]||0;
    d.innerHTML = `<span class="nm"></span>` +
      (c.member ? (n?`<span class="badge">${n}</span>`:"") : `<button class="join">join</button>`);
    d.querySelector(".nm").textContent = c.name;
    if (c.member) d.onclick = ()=>openChannel(c.id);
    else d.querySelector(".join").onclick = async e=>{ e.stopPropagation();
      try { await post(`/channels/${c.id}/join`); await refreshChannels(); openChannel(c.id); }
      catch(err){ toast(err.message); } };
    el.appendChild(d);
  }
}

$("#newCh").onclick = ()=>$("#chDialog").showModal();
$("#chForm").onsubmit = async ()=>{
  try {
    const r = await post("/channels",{name:$("#chName").value,
      description:$("#chDesc").value, private:$("#chPriv").checked});
    $("#chName").value=$("#chDesc").value=""; $("#chPriv").checked=false;
    await refreshChannels(); openChannel(r.channel_id);
  } catch(err){ toast(err.message); }
};

/* ---------- view switching ---------- */
// One place decides what the main pane shows: chat surfaces (messages,
// composer) or the board, plus which header actions apply.
function setView(v){
  S.view = v;
  $("#board").classList.toggle("on", v==="board");
  const chat = v!=="board";
  $("#msgs").style.display = chat ? "" : "none";
  $("#typing").style.display = (v==="chan" || v==="dm") ? "" : "none";
  document.querySelector(".composer").style.display = chat ? "" : "none";
  $("#thToggle").style.display = v==="chan" ? "" : "none";
  $("#newTh").style.display = v==="chan" ? "" : "none";
  $("#promote").style.display = (v==="chan" && !S.isRoot) ? "" : "none";
  $("#newIt").style.display = v==="board" ? "" : "none";
  $("#input").placeholder = v==="item"
    ? "Comment…  (**bold**, `code`, @**Full Name**, :rocket:)"
    : "Message…  (**bold**, `code`, @**Full Name**, :rocket:)";
  if (v!=="dm") S.dm = null;
  $("#threads").classList.remove("on");
  $("#results").classList.remove("on");
}

/* ---------- channel / thread views ---------- */
async function openChannel(id){
  S.ch = S.channels.find(c=>c.id===id); if (!S.ch) return;
  S.thread = S.ch.root_thread_id; S.isRoot = true; S.space = null;
  setView("chan");
  $("#viewTitle").textContent = "#"+S.ch.name;
  $("#viewDesc").textContent = S.ch.description||"";
  $("#crumb").style.display="none";
  renderChannels(); renderSpaces(); renderDMs();
  await Promise.all([loadMessages(), loadThreads()]);
  markRead();
}

async function openThread(t){
  S.thread = t.id; S.isRoot = false;
  setView("chan");
  $("#viewTitle").textContent = t.title || "(untitled thread)";
  $("#viewDesc").textContent = "in #"+S.ch.name;
  $("#crumb").style.display="";
  await loadMessages();
  markRead();
}
$("#crumb").onclick = ()=>{
  if (S.view==="item" && S.space) openBoard(S.space.id);
  else if (S.ch) openChannel(S.ch.id);
};

async function loadMessages(){
  const r = await api(`/threads/${S.thread}/messages?limit=100`);
  const msgs = (r.messages||[]).slice().reverse();
  await resolveUsers(msgs.map(m=>m.author_id));
  const el = $("#msgs"); el.innerHTML="";
  if (!msgs.length) el.innerHTML = `<div class="sys">No messages yet — say hello 👋</div>`;
  msgs.forEach(m=>el.appendChild(renderMsg(m)));
  el.scrollTop = el.scrollHeight;
}

function renderMsg(m){
  const d = document.createElement("div"); d.className="msg"; d.dataset.id=m.id;
  d.innerHTML = `<div class="av"></div>
    <div><span class="who"></span><span class="when"></span>
    <div class="body">${m.rendered}</div></div>`;
  d.querySelector(".av").textContent = initials(m.author_id);
  d.querySelector(".who").textContent = userName(m.author_id);
  return d;
}

async function loadThreads(){
  const r = await api(`/channels/${S.ch.id}/threads?limit=50`);
  const el = $("#threads"); el.innerHTML="";
  const ths = r.threads||[];
  if (!ths.length) el.innerHTML=`<div class="sys">No threads yet</div>`;
  for (const t of ths){
    const d=document.createElement("div"); d.className="th";
    d.innerHTML = `<span class="t"></span><span class="meta">${t.message_count} msgs</span>`+
      (t.resolved?`<span class="res">✓ resolved</span>`:"");
    d.querySelector(".t").textContent = t.title || "(untitled)";
    d.onclick = ()=>openThread(t);
    el.appendChild(d);
  }
}
$("#thToggle").onclick = ()=>$("#threads").classList.toggle("on");
$("#newTh").onclick = ()=>$("#thDialog").showModal();
$("#thForm").onsubmit = async ()=>{
  try {
    await post(`/channels/${S.ch.id}/threads`,
      {title:$("#thTitle").value, content:$("#thContent").value});
    $("#thTitle").value=$("#thContent").value="";
    await loadThreads(); $("#threads").classList.add("on");
  } catch(err){ toast(err.message); }
};

/* ---------- direct messages ---------- */
// A conversation's display name = the OTHER participants' names ("You" for
// the self conversation).
function dmName(d){
  const others = d.participant_ids.filter(id=>id!==S.me.user_id);
  if (!others.length) return "You";
  return others.map(userName).join(", ");
}

async function refreshDMs(){
  const r = await api("/dms");
  S.dms = r.dms||[];
  await resolveUsers(S.dms.flatMap(d=>d.participant_ids));
  renderDMs();
}

function renderDMs(){
  const el = $("#dmlist"); if (!el) return;
  el.innerHTML="";
  for (const d of S.dms){
    const row = document.createElement("div");
    row.className = "ch dmrow"+(S.dm && d.id===S.dm.id?" on":"");
    const n = S.dmUnreads[d.id]||0;
    row.innerHTML = `<span class="nm"><span class="pdot"></span><span class="dnm"></span></span>`+
      (n?`<span class="badge">${n}</span>`:"");
    const others = d.participant_ids.filter(id=>id!==S.me.user_id);
    const on = others.length ? others.some(id=>S.online.has(id)) : true;
    if (on) row.querySelector(".pdot").classList.add("on");
    row.querySelector(".dnm").textContent = dmName(d);
    row.onclick = ()=>openDM(d);
    el.appendChild(row);
  }
}

async function openDM(d){
  S.dm = d; S.ch = null; S.space = null;
  S.thread = d.root_thread_id; S.isRoot = true;
  setView("dm");
  $("#viewTitle").textContent = dmName(d);
  $("#viewDesc").textContent = d.kind===2 ? "group conversation" : "direct message";
  $("#crumb").style.display="none";
  renderChannels(); renderSpaces(); renderDMs();
  await loadMessages();
  markRead();
}

$("#newDm").onclick = async ()=>{
  try {
    const r = await api("/users");
    const el = $("#dmPicker"); el.innerHTML="";
    const others = (r.users||[]).filter(u=>u.id!==S.me.user_id);
    if (!others.length){ toast("Nobody else is here yet"); return; }
    for (const u of others){
      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type="checkbox"; cb.value=String(u.id);
      const dot = document.createElement("span");
      dot.className = "pdot"+(S.online.has(u.id)?" on":"");
      const nm = document.createElement("span"); nm.textContent = u.full_name;
      lab.append(cb, dot, nm);
      el.appendChild(lab);
    }
    $("#dmDialog").showModal();
  } catch(err){ toast(err.message); }
};
$("#dmForm").onsubmit = async ()=>{
  const ids = [...document.querySelectorAll("#dmPicker input:checked")]
    .map(cb=>Number(cb.value));
  if (!ids.length) return;
  try {
    const d = await post("/dms", {user_ids: ids});
    await refreshDMs();
    openDM(S.dms.find(x=>x.id===d.id) || d);
  } catch(err){ toast(err.message); }
};

/* ---------- spaces & board ---------- */
async function refreshSpaces(){
  const r = await api("/spaces");
  S.spaces = r.spaces||[];
  renderSpaces();
}

function renderSpaces(){
  const el = $("#splist"); el.innerHTML="";
  for (const sp of S.spaces){
    const d = document.createElement("div");
    d.className = "ch sp"+(S.space && sp.id===S.space.id?" on":"");
    d.innerHTML = `<span class="nm"></span><span class="key"></span>`;
    d.querySelector(".nm").textContent = sp.name;
    d.querySelector(".key").textContent = sp.key;
    d.onclick = ()=>openBoard(sp.id);
    el.appendChild(d);
  }
}

$("#newSp").onclick = ()=>$("#spDialog").showModal();
$("#spForm").onsubmit = async ()=>{
  try {
    const r = await post("/spaces",{key:$("#spKey").value, name:$("#spName").value});
    $("#spKey").value=$("#spName").value="";
    await refreshSpaces(); openBoard(r.id);
  } catch(err){ toast(err.message); }
};

async function openBoard(spaceID){
  const sp = S.spaces.find(s=>s.id===spaceID); if (!sp) return;
  S.space = sp; S.ch = null; S.thread = 0; S.isRoot = true;
  setView("board");
  $("#viewTitle").textContent = sp.name;
  $("#viewDesc").textContent = sp.key;
  $("#crumb").style.display="none";
  renderChannels(); renderSpaces(); renderDMs();
  const [sts, its] = await Promise.all([
    api(`/spaces/${sp.id}/statuses`), api(`/spaces/${sp.id}/items`)]);
  S.statuses = sts.statuses||[]; S.items = its.items||[];
  renderBoard();
}

async function loadItems(){
  if (!S.space) return;
  const r = await api(`/spaces/${S.space.id}/items`);
  S.items = r.items||[];
  renderBoard();
}

function renderBoard(){
  const el = $("#board"); el.innerHTML="";
  for (const st of S.statuses){
    const col = document.createElement("div");
    col.className = "col"; col.dataset.cat = st.category;
    col.innerHTML = `<div class="colhead"><span class="dot"></span><span class="cn"></span><span class="cnt"></span></div><div class="cards"></div>`;
    col.querySelector(".cn").textContent = st.name;
    const cards = col.querySelector(".cards");
    const mine = S.items.filter(it=>it.status_id===st.id);
    col.querySelector(".cnt").textContent = mine.length;
    for (const it of mine) cards.appendChild(renderCard(it));
    col.ondragover = e=>{ e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = ()=>col.classList.remove("over");
    col.ondrop = async e=>{
      e.preventDefault(); col.classList.remove("over");
      const id = Number(e.dataTransfer.getData("text/plain")); if (!id) return;
      try {
        await api(`/items/${id}`,{method:"PATCH",body:JSON.stringify({status_id:st.id})});
        await loadItems();
      } catch(err){ toast(err.message); }
    };
    el.appendChild(col);
  }
}

function renderCard(it){
  const d = document.createElement("div");
  d.className = "itemcard"; d.draggable = true;
  d.innerHTML = `<div class="ikey"><span class="k"></span><span class="itype"></span></div><div class="ititle"></div>`;
  d.querySelector(".k").textContent = it.key;
  const ty = d.querySelector(".itype");
  ty.textContent = it.type;
  if (it.type==="Bug") ty.classList.add("bug");
  if (it.type==="Epic") ty.classList.add("epic");
  if (it.resolved){
    const ok = document.createElement("span");
    ok.className="done"; ok.textContent="✓";
    d.querySelector(".ikey").appendChild(ok);
  }
  d.querySelector(".ititle").textContent = it.title;
  d.ondragstart = e=>{ e.dataTransfer.setData("text/plain", String(it.id)); d.classList.add("drag"); };
  d.ondragend = ()=>d.classList.remove("drag");
  d.onclick = ()=>openItem(it);
  return d;
}

$("#newIt").onclick = ()=>$("#itDialog").showModal();
$("#itForm").onsubmit = async ()=>{
  try {
    await post(`/spaces/${S.space.id}/items`, {title:$("#itTitle").value,
      description:$("#itDesc").value, type:$("#itType").value});
    $("#itTitle").value=$("#itDesc").value="";
    await loadItems();
  } catch(err){ toast(err.message); }
};

// The item view IS a chat view: the item's discussion is a real thread whose
// root message is the description (the D2 fusion, visible).
async function openItem(it){
  S.thread = it.thread_id; S.isRoot = false;
  setView("item");
  $("#viewTitle").textContent = `${it.key} · ${it.title}`;
  $("#viewDesc").textContent = `${it.status}${it.resolved?" · resolved":""} — in ${S.space.name}`;
  $("#crumb").style.display="";
  await loadMessages();
}

$("#promote").onclick = ()=>{
  if (!S.spaces.length){ toast("Create a space first"); return; }
  const sel = $("#prSpace"); sel.innerHTML="";
  for (const sp of S.spaces){
    const o = document.createElement("option");
    o.value = sp.id; o.textContent = `${sp.key} — ${sp.name}`;
    sel.appendChild(o);
  }
  $("#prDialog").showModal();
};
$("#prForm").onsubmit = async ()=>{
  try {
    const r = await post(`/threads/${S.thread}/promote`,
      {space_id:Number($("#prSpace").value)});
    toast(`Promoted to ${r.key}`, true);
    $("#viewDesc").textContent = `${r.key} · in #${S.ch.name}`;
  } catch(err){ toast(err.message); }
};

/* ---------- composing ---------- */
async function send(){
  const text = $("#input").value.trim(); if (!text) return;
  $("#input").value="";
  try {
    // One endpoint for every thread — the server routes permissions by the
    // thread's governing container (channel or space).
    await post(`/threads/${S.thread}/messages`, {content:text});
  } catch(err){ toast(err.message); $("#input").value=text; }
}
$("#send").onclick = send;
$("#input").addEventListener("keydown", e=>{
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  else signalTyping();
});

/* ---------- search ---------- */
let searchTimer = 0;
$("#search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q){ $("#results").classList.remove("on"); return; }
  searchTimer = setTimeout(()=>runSearch(q), 250);
});
async function runSearch(q){
  try {
    const r = await api("/search?q="+encodeURIComponent(q)+"&limit=40");
    const rs = r.results||[];
    await resolveUsers(rs.map(m=>m.author_id));
    const el = $("#results"); el.innerHTML=""; el.classList.add("on");
    if (!rs.length){ el.innerHTML=`<div class="sys">No matches</div>`; return; }
    for (const m of rs){
      const ch = S.channels.find(c=>c.id===m.channel_id);
      const d = document.createElement("div"); d.className="res";
      const meta = document.createElement("div"); meta.className="rmeta";
      // Item hits carry a key; promoted channel threads show both scopes.
      const parts = [];
      if (m.channel_id) parts.push("#"+(ch?ch.name:m.channel_id));
      if (m.item_key) parts.push(m.item_key);
      parts.push(userName(m.author_id), m.created_at.slice(0,10));
      meta.textContent = parts.join(" · ");
      const snip = document.createElement("div"); snip.className="rsnip";
      // Snippet is PLAIN TEXT with » « highlight markers — safe to set as text,
      // then upgrade the markers to styled spans.
      snip.textContent = m.snippet;
      snip.innerHTML = snip.innerHTML.replace(/»/g,'<span class="hl">').replace(/«/g,'</span>');
      d.append(meta, snip);
      d.onclick = ()=>{ $("#search").value=""; el.classList.remove("on");
        if (!m.channel_id && m.space_id){ openItemByThread(m.space_id, m.thread_id); }
        else if (ch && ch.member){ openChannel(m.channel_id).then(()=>{
          if (m.thread_id !== ch.root_thread_id) openThreadById(m.thread_id); }); } };
      el.appendChild(d);
    }
  } catch(err){ toast(err.message); }
}
async function openThreadById(id){
  try {
    const r = await api(`/channels/${S.ch.id}/threads?limit=100`);
    const t = (r.threads||[]).find(x=>x.id===id);
    if (t) openThread(t);
  } catch {}
}
async function openItemByThread(spaceID, threadID){
  try {
    await openBoard(spaceID);
    const it = S.items.find(i=>i.thread_id===threadID);
    if (it) openItem(it);
  } catch {}
}

/* ---------- realtime ---------- */
function connectWS(){
  const proto = location.protocol==="https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/v1/gateway?token=${S.token}&last_id=${S.lastSeq}`);
  S.ws = ws;
  ws.onopen = ()=>{ S.wsTries=0; };
  ws.onclose = ()=>{ setTimeout(connectWS, Math.min(8000, 500*Math.pow(2,S.wsTries++))); };
  ws.onmessage = ev => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    if (e.seq) S.lastSeq = e.seq;
    const p = e.payload||{};
    switch(e.type){
      case "message.created": onMessage(p); break;
      case "thread.created": case "thread.titled":
      case "thread.resolved": case "thread.reopened":
        if (S.ch && p.channel_id===S.ch.id) loadThreads(); break;
      case "channel.created": case "member.joined": case "member.left":
        refreshChannels(); break;
      case "space.created": refreshSpaces(); break;
      case "dm.opened": refreshDMs(); break;
      case "presence.changed":
        if (p.state==="online") S.online.add(p.user_id);
        else S.online.delete(p.user_id);
        renderDMs(); break;
      case "workitem.created": case "workitem.updated":
      case "workitem.status_changed": case "workitem.promoted_from_thread":
        if (S.view==="board" && S.space && p.space_id===S.space.id) loadItems();
        break;
      case "typing.started": onTyping(p, true); break;
      case "typing.stopped": onTyping(p, false); break;
      case "readstate.synced": refreshChannels(); break;
    }
  };
}

async function onMessage(p){
  // Space-thread messages carry no channel_id — they only matter here when
  // the item's thread is open.
  if (S.view!=="board" && p.thread_id===S.thread){
    try {
      const m = await api(`/messages/${p.message_id}`);
      await resolveUsers([m.author_id]);
      const el = $("#msgs");
      if (!el.querySelector(`[data-id="${m.id}"]`)){
        el.querySelector(".sys")?.remove();
        el.appendChild(renderMsg(m)); el.scrollTop = el.scrollHeight;
      }
      markRead();
    } catch {}
  } else if (p.channel_id){
    S.unreads[p.channel_id] = (S.unreads[p.channel_id]||0)+1;
    renderChannels();
  } else if (p.dm_space_id){
    S.dmUnreads[p.dm_space_id] = (S.dmUnreads[p.dm_space_id]||0)+1;
    renderDMs();
  }
  if (S.ch && p.channel_id===S.ch.id && S.isRoot) loadThreads();
}

function markRead(){
  // Watermarks cover channel and DM threads (space read state is a later
  // slice) — item views skip this.
  if (!S.thread || (!S.ch && !S.dm)) return;
  if (S.ws && S.ws.readyState===1)
    S.ws.send(JSON.stringify({type:"read_marker", thread_id:S.thread, up_to:0}));
  else post(`/threads/${S.thread}/read`,{up_to:0}).catch(()=>{});
  if (S.ch){ S.unreads[S.ch.id]=0; renderChannels(); }
  if (S.dm){ S.dmUnreads[S.dm.id]=0; renderDMs(); }
}

function signalTyping(){
  const now = Date.now();
  if (now < S.typingUntil) return;
  S.typingUntil = now + 2500;
  if (!S.ws || S.ws.readyState!==1) return;
  if (S.view==="chan" && S.ch)
    S.ws.send(JSON.stringify({type:"typing", channel_id:S.ch.id, state:"start"}));
  else if (S.view==="dm" && S.dm)
    S.ws.send(JSON.stringify({type:"typing", dm_space_id:S.dm.id, state:"start"}));
}

function onTyping(p, on){
  const inChannel = S.ch && p.channel_id && p.channel_id===S.ch.id;
  const inDM = S.dm && p.dm_space_id && p.dm_space_id===S.dm.id;
  if (!inChannel && !inDM) return;
  if (on){ S.typers.set(p.user_id, Date.now()); } else { S.typers.delete(p.user_id); }
  renderTyping();
  resolveUsers([p.user_id]).then(renderTyping);
}
setInterval(()=>{ const cut=Date.now()-4000; let ch=false;
  for (const [k,v] of S.typers) if (v<cut){ S.typers.delete(k); ch=true; }
  if (ch) renderTyping(); }, 1500);
function renderTyping(){
  const who = [...S.typers.keys()];
  $("#typing").textContent =
    who.length===0 ? "" :
    who.length===1 ? userName(who[0])+" is typing…" :
    who.length===2 ? userName(who[0])+" and "+userName(who[1])+" are typing…" :
    who.length+" people are typing…";
}

/* ---------- boot ---------- */
if (S.token) enter().catch(()=>signOut());
</script>
</body>
</html>
